# OpenVAF-Reloaded (`openvaf-r`, from this flake's dev shell): a Verilog-A
# compiler to OSDI.
# It has no digital or mixed-signal language: verilog/ and verilog-ams/ skip.
compile.verilog-a = openvaf-r -I "$CONFORM_INCLUDE" -I "$CONFORM_DIR" "$CONFORM_SRC" -o "$CONFORM_WORK/$CONFORM_STEM.osdi"
compile.spice     = openvaf-r -I "$CONFORM_INCLUDE" -I "$CONFORM_DIR" "$CONFORM_SRC" -o "$CONFORM_WORK/$CONFORM_STEM.osdi"
# The run stage loads the library into ngspice at the test's DC bias point
# and prints the model's own `ok=` checks (tools/ngspice-osdi.py; it exits 77,
# SKIP, for a testbench it cannot express yet).
run.verilog-a = python3 "$CONFORM_TOOLDIR/ngspice-osdi.py"
run.spice     = python3 "$CONFORM_TOOLDIR/ngspice-osdi.py"

# Verilator (--binary, with --timing for 1364 delays), from this flake's dev
# shell. IEEE 1364 only. Its `- file:line: Verilog $finish` line (17.4.1
# leaves the report to the tool) is dropped from the transcript.
compile.verilog = std=${CONFORM_STD:-1364-2005}; verilator --binary --timing --default-language $std -Wno-fatal -Wno-lint -Wno-style --Mdir "$CONFORM_WORK/obj" -o sim -I"$CONFORM_DIR" ${CONFORM_INCDIR:+-I$CONFORM_INCDIR} "$CONFORM_SRC" $CONFORM_FILES
run.verilog     = "$CONFORM_WORK/obj/sim" > "$CONFORM_WORK/raw"; s=$?; grep -Ev '^- [^ ]+:[0-9]+: Verilog \$(finish|stop)' "$CONFORM_WORK/raw"; exit $s

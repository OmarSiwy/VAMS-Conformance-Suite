# ngspice, from this flake's dev shell: SPICE netlists (external manifests'
# `netlist` rows). The Annex E tests under tests/spice/ are Verilog-AMS
# sources; ngspice runs those through openvaf.conf.
run.netlist = export ngspice_vpath="$CONFORM_DIR"; [ -d "$CONFORM_INCLUDE/bin" ] && export SPICE_SCRIPTS="$CONFORM_INCLUDE/bin"; ngspice --batch "$CONFORM_SRC"

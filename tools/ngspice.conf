# ngspice, from this flake's dev shell: SPICE netlists, both tests/netlist/
# decks (judged against their .expected.json by rawcheck.py) and the external
# manifests' decks (stdout against upstream's .out). The Annex E tests under
# tests/spice/ are Verilog-AMS sources; ngspice runs those through
# openvaf.conf. A `* VPI FIXTURE` deck tests ESPice's own VPI extension: SKIP.
run.netlist = grep -q '^\*[[:space:]]*VPI FIXTURE' "$CONFORM_SRC" && { echo "VPI fixture: an ESPice extension" >&2; exit 77; }; export ngspice_vpath="$CONFORM_DIR"; [ -d "$CONFORM_INCLUDE/bin" ] && export SPICE_SCRIPTS="$CONFORM_INCLUDE/bin"; python3 "$CONFORM_TOOLDIR/rawcheck.py" 'ngspice --batch ${RAW:+-r "$RAW"} "$DECK"'

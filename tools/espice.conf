# ESPice, https://github.com/OmarSiwy/ESPice: SPICE netlists, judged as in
# ngspice.conf. ESPICE overrides the executable. A deck's oracle names the
# dialect it is written in (`tokenizer`: hspice, spectre); rawcheck.py passes
# it on as TOKENIZER. A `* VPI FIXTURE` deck loads ESPice's VPI test library
# (built by ESPice from tests/netlist/hdl/veriloga_vpi_app.assets/vpi_gain.c),
# named by ESPICE_VPI; without it the deck SKIPs.
run.netlist = VPI_ARGS=; if grep -q '^\*[[:space:]]*VPI FIXTURE' "$CONFORM_SRC"; then [ -n "$ESPICE_VPI" ] || { echo "VPI fixture: set ESPICE_VPI to the built vpi_gain library" >&2; exit 77; }; VPI_ARGS="--vpi $ESPICE_VPI"; fi; export VPI_ARGS; python3 "$CONFORM_TOOLDIR/rawcheck.py" '${ESPICE:-espice} --format=binary -b ${RAW:+-r "$RAW"} --tokenizer "${TOKENIZER:-ngspice}" $VPI_ARGS "$DECK"'
